
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursion Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 150px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            padding: 15px;
            background: #f1f1f1;
            min-height: 100px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Recursion Practice</h1>

    <input
        type="number"
        id="numberInput"
        placeholder="Enter a number"
        min="0"
    >

    <br>

    <button id="countdownBtn">Countdown</button>

    <button id="countupBtn">Count Up</button>

    <div id="output">
        Result will appear here
    </div>

    <script src="main.js"></script>

</body>
</html>
