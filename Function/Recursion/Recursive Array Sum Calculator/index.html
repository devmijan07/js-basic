
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive Array Sum</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            margin: 15px 0;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Recursive Array Sum</h1>

    <p>Enter numbers separated by commas</p>

    <input
        type="text"
        id="numberInput"
        placeholder="10, 20, 30, 40, 50"
    >

    <br>

    <button id="calculateBtn">Calculate Sum</button>

    <div id="output">
        Result will appear here
    </div>

    <script src="main.js"></script>

</body>
</html>
